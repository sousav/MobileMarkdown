name: mobile_markdown
description: "A free, no-ads markdown viewer for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  markdown_widget: ^2.3.2      # Markdown rendering with syntax highlighting
  file_picker: ^8.0.0           # Cross-platform file selection
  share_handler: ^0.0.21        # Receive files from share sheet
  path_provider: ^2.1.0         # Platform directories
  url_launcher: ^6.2.0          # Open links from markdown
  shared_preferences: ^2.2.0    # Store recent files list
  flutter_native_splash: ^2.4.0  # Native splash screen

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  adaptive_icon_background: "#1976D2"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter_native_splash:
  color: "#1976D2"
  color_dark: "#0D47A1"
  image: "assets/icon_foreground.png"
  image_dark: "assets/icon_foreground.png"
  android_12:
    color: "#1976D2"
    color_dark: "#0D47A1"
    image: "assets/icon_foreground.png"
    image_dark: "assets/icon_foreground.png"
  web: false
